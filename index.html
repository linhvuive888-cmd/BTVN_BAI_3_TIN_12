<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Challenge 12 - Luyện Đề Bài 3</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --pastel-sky: #e0f2fe;
            --pastel-purple: #f3e8ff;
            --pastel-peach: #ffe4e6;
            --cyan-accent: #06b6d4;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-card: #ffffff;
            --bg-page: #f8fafc;
            --border-soft: #e2e8f0;
            --correct: #10b981;
            --correct-soft: #d1fae5;
            --wrong: #ef4444;
            --wrong-soft: #fee2e2;
            --flagged: #f59e0b;
            --flagged-soft: #fef3c7;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(at 0% 0%, var(--pastel-sky) 0px, transparent 50%),
                radial-gradient(at 100% 0%, var(--pastel-purple) 0px, transparent 50%),
                radial-gradient(at 50% 100%, var(--pastel-peach) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. TOP STICKY BAR */
        #top-sticky-bar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-soft);
            padding: 8px 24px;
            display: none;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .user-meta-group {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--primary-soft);
            border-radius: 8px;
            color: var(--primary);
        }

        .timer-display {
            font-family: 'Consolas', monospace;
            font-size: 16px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            background: var(--pastel-sky);
            color: #0369a1;
            border: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .timer-warn-10 { background: #fef08a; color: #854d0e; border-color: #fde047; }
        .timer-warn-5 { background: #fed7aa; color: #9a3412; border-color: #fdba74; }
        .timer-warn-1 { background: #fecaca; color: #991b1b; border-color: #fca5a5; animation: pulseRed 1s infinite; }

        @keyframes pulseRed {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.03); }
        }

        /* 2. MAIN LAYOUT */
        main {
            flex: 1;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .app-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.06);
            padding: 32px;
            animation: fadeIn 0.35s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 3. BUTTONS & CONTROLS */
        .btn {
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid var(--border-soft);
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-flag {
            background: var(--flagged-soft);
            color: #b45309;
            border: 1px solid #fde68a;
        }
        .btn-flag.active {
            background: #f59e0b;
            color: #ffffff;
        }
        .btn-submit {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); }

        /* 4. MÀN HÌNH ĐĂNG NHẬP & HƯỚNG DẪN */
        .auth-box {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }
        .app-badge-title {
            display: inline-block;
            background: var(--pastel-sky);
            color: #0284c7;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        h1.main-title {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        p.sub-title {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border-soft);
            font-size: 15px;
            font-family: var(--font-main);
            outline: none;
            transition: all 0.2s;
            background: #fcfcfd;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .guide-box {
            background: #f8fafc;
            border-radius: 14px;
            border: 1px dashed var(--border-soft);
            padding: 18px;
            text-align: left;
            margin: 20px 0;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* 5. GIAO DIỆN THI (QUIZ LAYOUT) */
        .exam-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
        }

        .question-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .level-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .level-nb { background: #e0f2fe; color: #0369a1; }
        .level-th { background: #fef3c7; color: #92400e; }
        .level-vd { background: #fce7f3; color: #9d174d; }

        .question-content {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.65;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        /* Multiple Choice Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .option-item {
            background: #ffffff;
            border: 1.5px solid var(--border-soft);
            border-radius: 14px;
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s;
            font-size: 15px;
            line-height: 1.5;
        }
        .option-item:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
            transform: translateX(3px);
        }
        .option-item.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
        }
        .opt-letter {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f1f5f9;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }
        .option-item.selected .opt-letter {
            background: var(--primary);
            color: #ffffff;
        }

        /* True/False Statements Grid */
        .tf-statement-row {
            background: #ffffff;
            border: 1.5px solid var(--border-soft);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .tf-text {
            font-size: 15px;
            line-height: 1.5;
            flex: 1;
        }
        .tf-btn-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .tf-btn {
            font-family: var(--font-main);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--border-soft);
            background: #f8fafc;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tf-btn.selected-true {
            background: var(--correct-soft);
            color: #065f46;
            border-color: var(--correct);
        }
        .tf-btn.selected-false {
            background: var(--wrong-soft);
            color: #991b1b;
            border-color: var(--wrong);
        }

        /* Bảng điều hướng câu hỏi (Navigation Palette) */
        .palette-card {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }
        .palette-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .nav-btn {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            background: #f8fafc;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .nav-btn:hover { background: #f1f5f9; }
        .nav-btn.answered {
            background: var(--primary-soft);
            color: var(--primary);
            border-color: #c7d2fe;
        }
        .nav-btn.current {
            background: #7c3aed;
            color: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.25);
        }
        .nav-btn.flagged::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--flagged);
        }

        /* 6. TOAST THÔNG BÁO */
        #time-toast {
            position: fixed;
            bottom: 60px;
            right: 24px;
            background: #1e293b;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            border-left: 4px solid var(--cyan-accent);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 7. MÀN HÌNH KẾT QUẢ VÀ XEM LẠI */
        .score-hero-box {
            text-align: center;
            padding: 24px 16px;
            background: linear-gradient(135deg, var(--pastel-sky) 0%, var(--pastel-purple) 100%);
            border-radius: 18px;
            margin-bottom: 24px;
        }
        .score-big {
            font-size: 52px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin: 8px 0;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-card .val {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            margin-top: 4px;
        }

        /* Review Item Card */
        .review-card {
            background: #ffffff;
            border: 1.5px solid var(--border-soft);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: left;
        }
        .review-card.correct-card { border-left: 5px solid var(--correct); }
        .review-card.wrong-card { border-left: 5px solid var(--wrong); }
        .explanation-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-dark);
            margin-top: 10px;
            border-left: 3px solid var(--primary);
        }

        /* FOOTER CỐ ĐỊNH CHỮ KÝ */
        footer {
            margin-top: auto;
            padding: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* RESPONSIVE */
        @media (max-width: 820px) {
            .exam-grid { grid-template-columns: 1fr; }
            .palette-card { order: 2; }
            .app-card { padding: 20px; }
            h1.main-title { font-size: 24px; }
            .question-content { font-size: 16px; }
        }
    </style>
</head>

        // Âm thanh Web Audio API
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function toggleSound() {
            initAudio();
            soundEnabled = !soundEnabled;
            document.getElementById("sound-btn").textContent = soundEnabled ? "🔊" : "🔇";
        }

        function playTone(freq, duration, type = "sine") {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // =======================================
        function saveToStorage() {
            const cache = {
                studentInfo,
                examState: {
                    currentIndex: examState.currentIndex,
                    part1Answers: examState.part1Answers,
                    part2Answers: examState.part2Answers,
                    flaggedQuestions: Array.from(examState.flaggedQuestions),
                    startTimeStr: examState.startTimeStr,
                    targetEndTimeMs: examState.targetEndTimeMs,
                    isSubmitted: examState.isSubmitted
                }
            };
            localStorage.setItem("NET_CHALLENGE_12_CACHE", JSON.stringify(cache));
        }

        function loadFromStorage() {
            const raw = localStorage.getItem("NET_CHALLENGE_12_CACHE");
            if (!raw) return false;
            try {
                const data = JSON.parse(raw);
                if (data.studentInfo && data.studentInfo.sessionId && !data.examState.isSubmitted) {
                    studentInfo = data.studentInfo;
                    examState.currentIndex = data.examState.currentIndex;
                    examState.part1Answers = data.examState.part1Answers || {};
                    examState.part2Answers = data.examState.part2Answers || {};
                    examState.flaggedQuestions = new Set(data.examState.flaggedQuestions || []);
                    examState.startTimeStr = data.examState.startTimeStr;
                    examState.targetEndTimeMs = data.examState.targetEndTimeMs;
                    examState.isSubmitted = data.examState.isSubmitted;
                    return true;
                }
            } catch (e) {}
            return false;
        }

        function startRealtimeTimer() {
            if (examState.timerInterval) clearInterval(examState.timerInterval);

            function updateTimer() {
                const now = Date.now();
                const diffMs = examState.targetEndTimeMs - now;

                if (diffMs <= 0) {
                    clearInterval(examState.timerInterval);
                    document.getElementById("exam-timer").textContent = "⏱ HẾT GIỜ 00:00";
                    alert("⏰ ĐÃ HẾT 45 PHÚT! Hệ thống đang tự động nộp bài thi của bạn.");
                    submitExamFinal("HẾT GIỜ");
                    return;
                }

                const totalSec = Math.floor(diffMs / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                const timerEl = document.getElementById("exam-timer");

                timerEl.textContent = `⏱ CÒN LẠI ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                // Đổi màu cảnh báo
                timerEl.className = "timer-display";
                if (totalSec <= 60) {
                    timerEl.classList.add("timer-warn-1");
                } else if (totalSec <= 300) {
                    timerEl.classList.add("timer-warn-5");
                } else if (totalSec <= 600) {
                    timerEl.classList.add("timer-warn-10");
                }

                // Cảnh báo Toast không gây giật mình
                if (totalSec === 600) showToast("⏰ Còn 10 phút! Em hãy rà soát lại các câu đã làm nhé.");
                if (totalSec === 300) showToast("⏰ Còn 5 phút! Chuẩn bị hoàn thiện các nhận định còn trống.");
                if (totalSec === 60) showToast("⏰ Còn 1 phút! Hệ thống sắp đóng lượt nộp.");
            }

            updateTimer();
            examState.timerInterval = setInterval(updateTimer, 1000);
        }

        function showToast(msg) {
            const t = document.getElementById("time-toast");
            t.textContent = msg;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 5000);
        }

            container.innerHTML = `
                <div class="exam-grid">
                    <div>
                        ${questionAreaHtml}
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; border-top: 1px solid var(--border-soft); padding-top: 16px;">
                            <button class="btn btn-secondary" onclick="navigateQuestion(${idx - 1})" ${idx === 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>
                                ◀ Câu trước
                            </button>
                            <button class="btn btn-flag ${examState.flaggedQuestions.has(idx) ? 'active' : ''}" onclick="toggleFlagQuestion(${idx})">
                                🚩 Đánh dấu xem lại
                            </button>
                            <button class="btn btn-primary" onclick="navigateQuestion(${idx + 1})" ${idx === 30 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>
                                Câu tiếp ▶
                            </button>
                        </div>
                    </div>

                    <!-- BẢNG ĐIỀU HƯỚNG CÂU HỎI -->
                    <div class="palette-card">
                        <div class="palette-title">
                            <span>Bảng câu hỏi (31 câu)</span>
                            <span style="font-size:12px; color:var(--text-muted);">Phần I & II</span>
                        </div>
                        <div class="nav-grid">
                            ${Array.from({ length: 31 }, (_, i) => {
                                let answeredClass = "";
                                if (i < 28) {
                                    if (examState.part1Answers[i] !== undefined) answeredClass = "answered";
                                } else {
                                    const tfAns = examState.part2Answers[i - 28];
                                    if (tfAns && Object.keys(tfAns).length === 4) answeredClass = "answered";
                                }
                                const isCurrent = (i === idx) ? "current" : "";
                                const isFlagged = examState.flaggedQuestions.has(i) ? "flagged" : "";
                                return `<button class="nav-btn ${answeredClass} ${isCurrent} ${isFlagged}" onclick="navigateQuestion(${i})">${i + 1}</button>`;
                            }).join('')}
                        </div>

                        <div style="display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--border-soft); padding-top:12px;">
                            <div style="display:flex; align-items:center; gap:8px;"><span style="width:12px; height:12px; background:#e0e7ff; border-radius:3px;"></span> Đã trả lời</div>
                            <div style="display:flex; align-items:center; gap:8px;"><span style="width:12px; height:12px; background:#7c3aed; border-radius:3px;"></span> Đang xem</div>
                            <div style="display:flex; align-items:center; gap:8px;"><span style="width:12px; height:12px; background:var(--flagged); border-radius:3px;"></span> Đánh dấu xem lại</div>
                        </div>

                        <button class="btn btn-submit" style="width:100%; margin-top:8px;" onclick="confirmSubmitExam()">
                            NỘP BÀI THI ➔
                        </button>
                    </div>
                </div>
            `;
        }

        function selectPart1Answer(qIdx, letter) {
            examState.part1Answers[qIdx] = letter;
            saveToStorage();
            renderQuestionView();
        }

        function selectPart2Answer(tfIdx, subKey, boolVal) {
            if (!examState.part2Answers[tfIdx]) examState.part2Answers[tfIdx] = {};
            examState.part2Answers[tfIdx][subKey] = boolVal;
            saveToStorage();
            renderQuestionView();
        }

        function toggleFlagQuestion(idx) {
            if (examState.flaggedQuestions.has(idx)) {
                examState.flaggedQuestions.delete(idx);
            } else {
                examState.flaggedQuestions.add(idx);
            }
            saveToStorage();
            renderQuestionView();
        }

        function navigateQuestion(targetIdx) {
            if (targetIdx >= 0 && targetIdx < 31) {
                examState.currentIndex = targetIdx;
                renderQuestionView();
            }
        }

        function updateProgressCounters() {
            let answered = 0;
            for (let i = 0; i < 28; i++) {
                if (examState.part1Answers[i] !== undefined) answered++;
            }
            for (let t = 0; t < 3; t++) {
                const sub = examState.part2Answers[t];
                if (sub && Object.keys(sub).length === 4) answered++;
            }
            document.getElementById("bar-progress").textContent = `${answered}/31`;
        }

        // =======================================
        // XÁC NHẬN NỘP BÀI & TÍNH ĐIỂM
        // =======================================
        function confirmSubmitExam() {
            let unAnsweredPart1 = 0;
            for (let i = 0; i < 28; i++) {
                if (examState.part1Answers[i] === undefined) unAnsweredPart1++;
            }
            let unAnsweredPart2Statements = 0;
            for (let t = 0; t < 3; t++) {
                const sub = examState.part2Answers[t] || {};
                ['a', 'b', 'c', 'd'].forEach(k => {
                    if (sub[k] === undefined) unAnsweredPart2Statements++;
                });
            }

            const totalUnanswered = unAnsweredPart1 + unAnsweredPart2Statements;
            let warnMsg = "Bạn có chắc chắn muốn nộp bài thi ngay lúc này?";
            if (totalUnanswered > 0) {
                warnMsg = `⚠️ BẠN CÒN ${totalUnanswered} CÂU/NHẬN ĐỊNH CHƯA TRẢ LỜI!\nBạn có chắc chắn muốn nộp bài và kết thúc thời gian làm bài?`;
            }

            if (confirm(warnMsg)) {
                submitExamFinal("NỘP SỚM");
            }
        }

        function submitExamFinal(statusText) {
            if (examState.isSubmitted) return;
            examState.isSubmitted = true;
            if (examState.timerInterval) clearInterval(examState.timerInterval);

            examState.endTimeStr = new Date().toLocaleTimeString('vi-VN');

            // 1. Tính toán điểm Phần I (28 câu x 0.25đ = 7.00đ)
            let part1Correct = 0;
            let nb = 0, th = 0, vd = 0;

            EXAM_BANK.part1.forEach((q, i) => {
                const userAns = examState.part1Answers[i];
                if (userAns === q.correctAnswer) {
                    part1Correct++;
                    if (q.level === "nhan_biet") nb += 0.25;
                    else if (q.level === "thong_hieu") th += 0.25;
                    else vd += 0.25;
                }
            });

            // 2. Tính toán điểm Phần II (3 câu x 4 nhận định = 12 nhận định x 0.25đ = 3.00đ)
            let part2CorrectStatements = 0;
            EXAM_BANK.part2.forEach((q, tIdx) => {
                const userTf = examState.part2Answers[tIdx] || {};
                q.statements.forEach((stmt, sIdx) => {
                    const key = ['a', 'b', 'c', 'd'][sIdx];
                    if (userTf[key] === stmt.correctAnswer) {
                        part2CorrectStatements++;
                        if (stmt.level === "nhan_biet") nb += 0.25;
                        else if (stmt.level === "thong_hieu") th += 0.25;
                        else vd += 0.25;
                    }
                });
            });

            const p1Score = Math.round(part1Correct * 0.25 * 100) / 100;
            const p2Score = Math.round(part2CorrectStatements * 0.25 * 100) / 100;
            const totalScore = Math.round((p1Score + p2Score) * 100) / 100;

            examState.scoreSummary = {
                part1Score: p1Score,
                part2Score: p2Score,
                totalScore: totalScore,
                part1Correct: part1Correct,
                part2CorrectStatements: part2CorrectStatements,
                nbScore: Math.round(nb * 100) / 100,
                thScore: Math.round(th * 100) / 100,
                vdScore: Math.round(vd * 100) / 100,
                status: statusText
            };

            saveToStorage();
            playTone(880, 0.3);

            // Ẩn thanh top bar khi xem kết quả
            document.getElementById("top-sticky-bar").style.display = "none";

            // Hiển thị màn hình tổng kết
            renderResultScreen();

            // Gửi dữ liệu về Google Apps Script
            syncToGoogleSheets();
        }

        // =======================================
        // GỬI DỮ LIỆU GOOGLE APPS SCRIPT WEB APP
        // =======================================
        function syncToGoogleSheets() {
            if (examState.resultSubmittedServer) return;

            const syncCard = document.getElementById("sync-status-box");
            if (syncCard) syncCard.innerHTML = `<span style="color:#b45309;">⏳ Đang đồng bộ kết quả lên hệ thống Google Sheets...</span>`;

            // Chuẩn bị chi tiết câu trả lời
            const details = [];
            EXAM_BANK.part1.forEach((q, i) => {
                details.push({
                    id: q.id,
                    type: "multiple_choice",
                    level: q.level,
                    selected: examState.part1Answers[i] || null,
                    correctAnswer: q.correctAnswer,
                    correct: examState.part1Answers[i] === q.correctAnswer,
                    score: examState.part1Answers[i] === q.correctAnswer ? 0.25 : 0
                });
            });
            EXAM_BANK.part2.forEach((q, tIdx) => {
                const sub = examState.part2Answers[tIdx] || {};
                q.statements.forEach((stmt, sIdx) => {
                    const key = ['a', 'b', 'c', 'd'][sIdx];
                    details.push({
                        id: stmt.id,
                        type: "true_false",
                        level: stmt.level,
                        selected: sub[key] !== undefined ? sub[key] : null,
                        correctAnswer: stmt.correctAnswer,
                        correct: sub[key] === stmt.correctAnswer,
                        score: sub[key] === stmt.correctAnswer ? 0.25 : 0
                    });
                });
            });

            // Tính thời gian làm bài
            const elapsedSec = Math.max(0, Math.floor((APP_CONFIG.durationMinutes * 60) - ((examState.targetEndTimeMs - Date.now()) / 1000)));
            const durStr = `${Math.floor(elapsedSec / 60)} phút ${elapsedSec % 60} giây`;

            const payload = {
                timestamp: new Date().toLocaleString('vi-VN'),
                sessionId: studentInfo.sessionId,
                fullName: studentInfo.fullName,
                className: studentInfo.className,
                studentCode: studentInfo.studentCode,
                startTime: examState.startTimeStr,
                endTime: examState.endTimeStr,
                duration: durStr,
                part1Score: examState.scoreSummary.part1Score,
                part2Score: examState.scoreSummary.part2Score,
                totalScore: examState.scoreSummary.totalScore,
                part1Correct: examState.scoreSummary.part1Correct,
                part2Correct: examState.scoreSummary.part2CorrectStatements,
                nbScore: examState.scoreSummary.nbScore,
                thScore: examState.scoreSummary.thScore,
                vdScore: examState.scoreSummary.vdScore,
                unansweredCount: (28 - examState.scoreSummary.part1Correct) + (12 - examState.scoreSummary.part2CorrectStatements),
                status: examState.scoreSummary.status,
                answersDetail: JSON.stringify(details)
            };

            if (!APP_CONFIG.googleScriptUrl || APP_CONFIG.googleScriptUrl === "DAN_URL_WEB_APP_VAO_DAY") {
                if (syncCard) syncCard.innerHTML = `<span style="color:#b45309;">⚠️ Đã lưu offline trên máy tính (Chưa cấu hình URL Google Script).</span>`;
                return;
            }

            fetch(APP_CONFIG.googleScriptUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                examState.resultSubmittedServer = true;
                if (syncCard) syncCard.innerHTML = `<span style="color:var(--correct); font-weight:700;">✅ ĐÃ LƯU LỊCH SỬ LÀM BÀI LÊN HỆ THỐNG THÀNH CÔNG!</span>`;
            })
            .catch(() => {
                if (syncCard) {
                    syncCard.innerHTML = `
                        <div style="color:var(--wrong);">⚠️ Bài đã được chấm nhưng chưa thể gửi lịch sử lên hệ thống (Mất Internet).</div>
                        <div style="font-size:13px; color:var(--text-muted); margin-top:4px;">Dữ liệu đã được lưu tạm trên thiết bị.</div>
                        <button class="btn btn-secondary" style="margin-top:8px; padding:4px 12px; font-size:13px;" onclick="syncToGoogleSheets()">🔄 THỬ GỬI LẠI</button>
                    `;
                }
            });
        }

        // =======================================
        // MÀN HÌNH KẾT QUẢ VÀ NHẬN XÉT HỌC TẬP
        // =======================================
        function renderResultScreen() {
            const container = document.getElementById("app-container");
            const sc = examState.scoreSummary;

            let feedbackMsg = "";

            else if (sc.totalScore >= 5.0) feedbackMsg = "Đạt – Nên ôn lại những câu sai để nắm bài chắc hơn.";
            else feedbackMsg = "Cần ôn tập thêm – Hãy xem kĩ phần giải thích chi tiết và thử làm lại nhé!";

            container.innerHTML = `
                <div style="text-align: center;">
                    <span class="app-badge-title">KẾT QUẢ ÔN TẬP BÀI 3</span>

                        <div style="font-size: 15px; font-weight: 700; color: #4338ca;">TỔNG ĐIỂM ĐẠT ĐƯỢC</div>

                    </div>

                    <div class="stats-row">
                        <div class="stat-card">

                            <div class="val">${sc.part1Score.toFixed(2)} / 7,00</div>

                            <div class="val">${sc.part2Score.toFixed(2)} / 3,00</div>

                        </div>
                        <div class="stat-card">
                            <div style="font-size:12px; color:var(--text-muted); font-weight:700;">NHẬN BIẾT</div>
                            <div class="val">${sc.nbScore.toFixed(2)} đ</div>
                        </div>
                        <div class="stat-card">
                            <div style="font-size:12px; color:var(--text-muted); font-weight:700;">THÔNG HIỂU</div>
                            <div class="val">${sc.thScore.toFixed(2)} đ</div>
                        </div>
                        <div class="stat-card">
                            <div style="font-size:12px; color:var(--text-muted); font-weight:700;">VẬN DỤNG</div>
                            <div class="val">${sc.vdScore.toFixed(2)} đ</div>
                        </div>
                    </div>

                    <div id="sync-status-box" style="background:#f8fafc; border:1px dashed var(--border-soft); border-radius:12px; padding:12px; margin-bottom:20px;"></div>

                    <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:10px;">
                        <button class="btn btn-primary" onclick="renderReviewScreen('ALL')">🔍 XEM ĐÁP ÁN & GIẢI THÍCH CHI TIẾT</button>
                        <button class="btn btn-secondary" onclick="restartNewExam()">🔄 LÀM LẠI ĐỀ MỚI</button>

                </div>
            `;
        }

        // =======================================
        // XEM ĐÁP ÁN, GIẢI THÍCH VÀ BỘ LỌC
        // =======================================
        function renderReviewScreen(filterMode = 'ALL') {
            const container = document.getElementById("app-container");

            let reviewHtml = "";

            // Duyệt 28 câu Phần I
            EXAM_BANK.part1.forEach((q, i) => {
                const userAns = examState.part1Answers[i];
                const isCorrect = (userAns === q.correctAnswer);
                const isUnanswered = (userAns === undefined);

                // Lọc
                if (filterMode === 'WRONG' && isCorrect) return;
                if (filterMode === 'UNANSWERED' && !isUnanswered) return;
                if (filterMode === 'NB' && q.level !== 'nhan_biet') return;
                if (filterMode === 'TH' && q.level !== 'thong_hieu') return;
                if (filterMode === 'VD' && q.level !== 'van_dung') return;

                const cardClass = isCorrect ? "correct-card" : "wrong-card";
                const badgeText = isCorrect ? "✓ CHÍNH XÁC (+0.25đ)" : (isUnanswered ? "⚠️ CHƯA LÀM (0đ)" : "✕ CHƯA ĐÚNG (0đ)");
                const badgeColor = isCorrect ? "color:var(--correct);" : "color:var(--wrong);";

                reviewHtml += `
                    <div class="review-card ${cardClass}">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="font-weight:700; color:var(--primary);">Câu ${i + 1} (Phần I)</span>
                            <span style="font-weight:700; font-size:13px; ${badgeColor}">${badgeText}</span>
                        </div>
                        <div style="font-size:15px; font-weight:600; margin-bottom:12px;">${q.question}</div>
                        <div style="font-size:14px; margin-bottom:4px;">Bạn chọn: <strong style="${isCorrect ? 'color:var(--correct);' : 'color:var(--wrong);'}">${userAns ? `${userAns}. ${q.options.find(o => o.letter === userAns).text}` : 'Chưa trả lời'}</strong></div>
                        <div style="font-size:14px; margin-bottom:8px;">Đáp án đúng: <strong style="color:var(--correct);">${q.correctAnswer}. ${q.options.find(o => o.letter === q.correctAnswer).text}</strong></div>
                        <div class="explanation-box">
                            💡 <strong>Giải thích:</strong> ${q.explanation}
                        </div>
                    </div>
                `;
            });

            // Duyệt 3 câu Phần II
            EXAM_BANK.part2.forEach((q, tIdx) => {
                const subAns = examState.part2Answers[tIdx] || {};

                q.statements.forEach((stmt, sIdx) => {
                    const key = ['a', 'b', 'c', 'd'][sIdx];
                    const userVal = subAns[key];
                    const isCorrect = (userVal === stmt.correctAnswer);
                    const isUnanswered = (userVal === undefined);

                    if (filterMode === 'WRONG' && isCorrect) return;
                    if (filterMode === 'UNANSWERED' && !isUnanswered) return;
                    if (filterMode === 'NB' && stmt.level !== 'nhan_biet') return;
                    if (filterMode === 'TH' && stmt.level !== 'thong_hieu') return;
                    if (filterMode === 'VD' && stmt.level !== 'van_dung') return;

                    const cardClass = isCorrect ? "correct-card" : "wrong-card";
                    const badgeText = isCorrect ? "✓ CHÍNH XÁC (+0.25đ)" : (isUnanswered ? "⚠️ CHƯA LÀM (0đ)" : "✕ CHƯA ĐÚNG (0đ)");
                    const badgeColor = isCorrect ? "color:var(--correct);" : "color:var(--wrong);";

                    reviewHtml += `
                        <div class="review-card ${cardClass}">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <span style="font-weight:700; color:var(--cyan-accent);">Câu ${29 + tIdx} - Nhận định ${key}) (Phần II)</span>
                                <span style="font-weight:700; font-size:13px; ${badgeColor}">${badgeText}</span>
                            </div>
                            <div style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">Tình huống: ${q.context}</div>
                            <div style="font-size:15px; font-weight:600; margin-bottom:12px;"><strong>${key})</strong> ${stmt.text}</div>
                            <div style="font-size:14px; margin-bottom:4px;">Bạn chọn: <strong>${userVal === true ? 'ĐÚNG' : (userVal === false ? 'SAI' : 'Chưa chọn')}</strong></div>
                            <div style="font-size:14px; margin-bottom:8px;">Đáp án đúng: <strong style="color:var(--correct);">${stmt.correctAnswer ? 'ĐÚNG' : 'SAI'}</strong></div>
                            <div class="explanation-box">
                                💡 <strong>Giải thích:</strong> ${stmt.explanation}
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = `
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; border-bottom:1px solid var(--border-soft); padding-bottom:12px;">
                        <h2 style="font-size:22px; color:var(--primary); font-weight:800;">CHI TIẾT ĐÁP ÁN & LỜI GIẢI</h2>
                        <button class="btn btn-secondary" onclick="renderResultScreen()">◀ Quay lại Kết quả</button>
                    </div>

                    <!-- BỘ LỌC CÂU HỎI -->
                    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">
                        <button class="btn btn-secondary" style="padding:6px 14px; font-size:13px; ${filterMode === 'ALL' ? 'background:var(--primary); color:#fff;' : ''}" onclick="renderReviewScreen('ALL')">Tất cả (31 câu)</button>
                        <button class="btn btn-secondary" style="padding:6px 14px; font-size:13px; ${filterMode === 'WRONG' ? 'background:var(--wrong); color:#fff;' : ''}" onclick="renderReviewScreen('WRONG')">Câu làm sai</button>
                        <button class="btn btn-secondary" style="padding:6px 14px; font-size:13px; ${filterMode === 'UNANSWERED' ? 'background:#f59e0b; color:#fff;' : ''}" onclick="renderReviewScreen('UNANSWERED')">Chưa làm</button>
                        <button class="btn btn-secondary" style="padding:6px 14px; font-size:13px; ${filterMode === 'NB' ? 'background:#0284c7; color:#fff;' : ''}" onclick="renderReviewScreen('NB')">Nhận biết</button>
                        <button class="btn btn-secondary" style="padding:6px 14px; font-size:13px; ${filterMode === 'TH' ? 'background:#d97706; color:#fff;' : ''}" onclick="renderReviewScreen('TH')">Thông hiểu</button>
                        <button class="btn btn-secondary" style="padding:6px 14px; font-size:13px; ${filterMode === 'VD' ? 'background:#be185d; color:#fff;' : ''}" onclick="renderReviewScreen('VD')">Vận dụng</button>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:12px;">
                        ${reviewHtml || '<div style="text-align:center; padding:40px; color:var(--text-muted);">Không có câu hỏi nào khớp với bộ lọc này!</div>'}
                    </div>
                </div>
            `;
        }

        function restartNewExam() {
            if (confirm("Em có chắc chắn muốn làm lại đề mới? Một phiên làm bài độc lập mới sẽ được tạo lập!")) {
                localStorage.removeItem("NET_CHALLENGE_12_CACHE");
                examState.isSubmitted = false;
                examState.part1Answers = {};
                examState.part2Answers = {};
                examState.flaggedQuestions = new Set();
                examState.currentIndex = 0;
                examState.resultSubmittedServer = false;
                renderLoginScreen();
            }
        }

        // Tự động kiểm tra phiên làm bài khi tải trang
        window.onload = () => {
            if (loadFromStorage()) {
                startExamUI();
            } else {
                renderLoginScreen();
            }
        };
    </script>
</body>
</html>
